        .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 28px;
                max-width: 760px; margin-top: clamp(30px, 6vh, 60px); }
        .form .wide { grid-column: 1 / -1; }
        @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
        .form label { display: flex; flex-direction: column; gap: 10px; }
        .form label i { font-style: normal; color: var(--faint); margin-left: 6px; }
        .form input, .form select, .form textarea {
            font: inherit; font-size: 16px; color: var(--fg); background: transparent;
            border: 0; border-bottom: 1px solid var(--faint); border-radius: 0;
            padding: 8px 0 10px; outline: none; transition: border-color 0.2s; width: 100%;
            caret-color: var(--sig); }
        .form textarea { resize: vertical; line-height: 1.6; border: 1px solid var(--faint); padding: 12px; }
        .form select { appearance: none; cursor: pointer; }
        .form select option { background: var(--bg); }
        .form input:focus, .form select:focus, .form textarea:focus { border-color: var(--sig); }
        .form input::placeholder { color: var(--faint); }

        /* The message box's typing cursor: a thicker red bar, drawn by the
           script below. Browsers leave a page no say over the real caret's
           width, so once the script runs the real one is made invisible. */
        .form label.wide { position: relative; }
        .form textarea.fakecaret { caret-color: transparent; }
        .caretclip { position: absolute; overflow: hidden; pointer-events: none; visibility: hidden; }
        .caretclip.on { visibility: visible; }
        .caretbar { position: absolute; left: 0; top: 0; width: 3px; border-radius: 1px; background: var(--sig);
                    animation: caretblink 1.1s linear infinite; }
        @keyframes caretblink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .caretbar { animation: none; } }
        .honey { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
        .send { display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
        .send button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer;
                       font: inherit; font-size: clamp(26px, 5vw, 56px); font-weight: 700;
                       letter-spacing: -0.035em; text-transform: uppercase; color: var(--fg);
                       line-height: 1; transition: color 0.2s; }
        .send button em { font-style: normal; color: var(--sig); }
        .send button:focus-visible { color: var(--sig); }
        @media (hover: hover) { .send button:hover { color: var(--sig); } }
        .send button[disabled] { opacity: 0.4; cursor: default; }
        .status { line-height: 1.9; }
        .status.ok { color: var(--fg); }
        .status.err { color: var(--sig); }

<script>
/* A thicker red typing cursor in the message box. A hidden copy of the text
   (the mirror) finds where the real caret would sit, and a bar is placed
   there. Without JavaScript the browser's own thin red caret stays. */
(function () {
    const box = document.querySelector('textarea[name="message"]');
    if (!box) return;
    const clip = document.createElement('div');
    clip.className = 'caretclip';
    const bar = document.createElement('div');
    bar.className = 'caretbar';
    clip.append(bar);
    box.after(clip);
    const mirror = document.createElement('div');
    const probe = document.createElement('span');
    mirror.setAttribute('aria-hidden', 'true');
    mirror.style.cssText = 'position:absolute;top:0;left:-9999px;visibility:hidden;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word';
    document.body.append(mirror);
    const COPY = ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'fontVariant', 'letterSpacing', 'wordSpacing',
        'textTransform', 'textIndent', 'textAlign', 'lineHeight', 'tabSize', 'boxSizing',
        'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
        'borderTopWidth', 'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth'];
    let frame = 0;

    function place() {
        frame = 0;
        const show = document.activeElement === box && box.selectionStart === box.selectionEnd;
        clip.classList.toggle('on', show);
        if (!show) return;
        const cs = getComputedStyle(box);
        COPY.forEach(k => { mirror.style[k] = cs[k]; });
        mirror.style.width = box.clientWidth + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth) + 'px';
        mirror.textContent = box.value.slice(0, box.selectionStart);
        // The rest of the text sits in the probe, so a caret at a line wrap is measured
        // where the next word begins, as the browser draws it.
        probe.textContent = box.value.slice(box.selectionStart) || '.';
        mirror.append(probe);
        const size = parseFloat(cs.fontSize);
        const line = parseFloat(cs.lineHeight) || size * 1.2;
        const h = Math.round(size * 1.25);
        clip.style.cssText = `left:${box.offsetLeft + box.clientLeft}px;top:${box.offsetTop + box.clientTop}px;width:${box.clientWidth}px;height:${box.clientHeight}px`;
        bar.style.height = h + 'px';
        bar.style.transform = `translate(${probe.offsetLeft - box.scrollLeft - 1}px, ${probe.offsetTop - box.scrollTop + (line - h) / 2}px)`;
        // Solid while typing or moving, then blinking again.
        bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
    }
    const queue = () => { if (!frame) frame = requestAnimationFrame(place); };

    ['input', 'keydown', 'keyup', 'click', 'focus', 'blur', 'scroll', 'select', 'compositionupdate', 'pointerup', 'touchend']
        .forEach(ev => box.addEventListener(ev, queue));
    document.addEventListener('selectionchange', queue);
    addEventListener('resize', queue);
    if (window.ResizeObserver) new ResizeObserver(queue).observe(box);
    if (document.fonts) document.fonts.ready.then(queue);
    box.classList.add('fakecaret');
    queue();
})();
</script>
<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
// Back from FormSubmit's own confirmation (no-JS path) with ?sent.
if (new URLSearchParams(location.search).has('sent')) {
    status.textContent = 'Sent. We will get back to you.';
    status.className = 'status label ok';
}
form.addEventListener('submit', async e => {
    e.preventDefault();
    // People type links without the https://; add it so the email's link works.
    const link = form.elements.link;
    link.value = link.value.trim();
    if (link.value && !/^[a-z][a-z0-9+.-]*:\/\//i.test(link.value)) link.value = 'https://' + link.value;
    const button = form.querySelector('button');
    button.disabled = true;
    status.className = 'status label';
    status.textContent = 'Sending…';
    try {
        const r = await fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
            method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.success === 'false' || j.success === false) throw new Error(j.message || r.status);
        form.reset();
        status.textContent = 'Sent. We will get back to you.';
        status.className = 'status label ok';
    } catch (err) {
        console.warn('FormSubmit:', err.message);
        status.innerHTML = 'That did not go through. Email <a href="mailto:hello@audiospatials.com">hello@audiospatials.com</a> instead.';
        status.className = 'status label err';
    }
    button.disabled = false;
});
if (location.pathname.endsWith('.html')) history.replaceState(history.state, '', '/contact' + location.hash);
</script>
