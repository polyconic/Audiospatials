<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact &mdash; Audiospatials</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://audiospatials.com/contact">
    <meta name="description" content="Tell us about your project. We work on production, mixing and live instrumentation.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Contact — Audiospatials">
    <meta property="og:description" content="Tell us about your project. We work on production, mixing and live instrumentation.">
    <meta property="og:image" content="https://audiospatials.com/blur.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://audiospatials.com/contact">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/pages.css">
    <style>
        .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 28px;
                max-width: 760px; margin-top: clamp(30px, 6vh, 60px); }
        .form .wide { grid-column: 1 / -1; }
        @media (max-width: 560px) { .form { grid-template-columns: 1fr; } }
        .form label { display: flex; flex-direction: column; gap: 10px; }
        .form label i { font-style: normal; color: var(--faint); margin-left: 6px; }
        .form input, .form select, .form textarea {
            font: inherit; font-size: 16px; color: var(--fg); background: transparent;
            border: 0; border-bottom: 1px solid var(--faint); border-radius: 0;
            padding: 8px 0 10px; outline: none; transition: border-color 0.2s; width: 100%; }
        .form textarea { resize: vertical; line-height: 1.6; border: 1px solid var(--faint); padding: 12px; }
        .form select { appearance: none; cursor: pointer; }
        .form select option { background: var(--bg); }
        .form input:focus, .form select:focus, .form textarea:focus { border-color: var(--sig); }
        .form input::placeholder { color: var(--faint); }
        .honey { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
        .send { display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; }
        .send button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer;
                       font: inherit; font-size: clamp(26px, 5vw, 56px); font-weight: 700;
                       letter-spacing: -0.035em; text-transform: uppercase; color: var(--fg);
                       line-height: 1; transition: color 0.2s; }
        .send button em { font-style: normal; color: var(--sig); }
        .send button:hover, .send button:focus-visible { color: var(--sig); }
        .send button[disabled] { opacity: 0.4; cursor: default; }
        .status { line-height: 1.9; }
        .status.ok { color: var(--fg); }
        .status.err { color: var(--sig); }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:hello@audiospatials.com?subject=Audiospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5H4L12 11.6 20 5H22V19H2Z"/></svg>
</a>
</div>
<a class="backmark" href="/" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4.5V10H21V14H12V19.5Z"/></svg></a>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 11.5H19V21H13.8V15H10.2V21H5V11.5H2Z"/></svg></a>
<div class="wrap">
    <h1 data-arrive>Let&rsquo;s create<em>.</em></h1>
    <p class="lede">Tell us about your project.</p>

    <!-- FormSubmit forwards each message to hello@, which Namecheap forwards to
         the shared hello@audiospatials.com inbox that Gregor and Hunter both read. -->
    <form class="form" id="form" action="https://formsubmit.co/hello@audiospatials.com" method="POST">
        <input type="hidden" name="_subject" value="Audiospatials — new message">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://audiospatials.com/contact?sent">
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <label><span class="label">Name</span><input name="name" required autocomplete="name"></label>
        <label><span class="label">Email</span><input name="email" type="email" required autocomplete="email"></label>
        <label><span class="label">What do you need?</span>
            <select name="need">
                <option>Production</option>
                <option>Recording</option>
                <option>Mixing</option>
                <option selected>Not sure yet</option>
            </select>
        </label>
        <label><span class="label">Link to your music <i>optional</i></span><input name="link" type="url" placeholder="https://"></label>
        <label class="wide"><span class="label">Message</span><textarea name="message" rows="6" required></textarea></label>
        <div class="send wide">
            <button type="submit" data-arrive>Send<em>↗</em></button>
            <p class="status label" id="status" role="status"></p>
        </div>
    </form>

    <section>
        <p class="label">Audiospatials elsewhere</p>
        <ul class="rows">
            <li><a class="row" href="https://www.instagram.com/audiospatials/" rel="me noopener" target="_blank"><span class="n">Instagram</span><span class="u">@audiospatials</span></a></li>
            <li><a class="row" href="https://www.youtube.com/@audiospatials" rel="me noopener" target="_blank"><span class="n">YouTube</span><span class="u">@audiospatials</span></a></li>
            <li><a class="row" href="https://visuospatials.com/" rel="noopener" target="_blank"><span class="n">Visuospatials</span><span class="u">visuospatials.com</span></a></li>
        </ul>
    </section>
</div>

<nav class="exit">
    <a href="/">Audiospatials</a>
    <a href="/artists">Artists</a><a href="/music">Music</a><a href="/studio">Studio</a><a href="/about">About</a><span class="here">Contact</span>
    <span class="spacer"></span>
    <span class="copy">&copy; 2026 Audiospatials</span>
</nav>
<script src="/geo.js"></script>
<script src="/nav.js"></script>
<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
// Back from FormSubmit's own confirmation (no-JS path) with ?sent.
if (new URLSearchParams(location.search).has('sent')) {
    status.textContent = 'Sent. We will get back to you.';
    status.className = 'status label ok';
}
form.addEventListener('submit', async e => {
    e.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    status.className = 'status label';
    status.textContent = 'Sending…';
    try {
        const r = await fetch(form.action.replace('formsubmit.co/', 'formsubmit.co/ajax/'), {
            method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || j.success === 'false' || j.success === false) throw new Error(j.message || r.status);
        form.reset();
        status.textContent = 'Sent. We will get back to you.';
        status.className = 'status label ok';
    } catch (err) {
        console.warn('FormSubmit:', err.message);
        status.innerHTML = 'That did not go through. Email <a href="mailto:hello@audiospatials.com">hello@audiospatials.com</a> instead.';
        status.className = 'status label err';
    }
    button.disabled = false;
});
if (location.pathname.endsWith('.html')) history.replaceState(history.state, '', '/contact' + location.hash);
</script>
</body>
</html>
