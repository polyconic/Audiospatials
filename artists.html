<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 11.5H19V21H13.8V15H10.2V21H5V11.5H2Z"/></svg></a>
<div class="wrap">
    <h1 data-arrive>Artists<em>.</em></h1>

</div>

<nav class="exit">
    <a href="/">Audiospatials</a>

</nav>
<script src="/content/artists.js"></script>
<script>
const tiles = document.getElementById('tiles');
ARTISTS.forEach(a => {
    const el = document.createElement('a');
    el.className = 'tile';
    el.href = '/' + a.slug;
    el.innerHTML = '<div class="shot"><img alt="" loading="lazy" decoding="async"></div><div class="cap"><span class="t"></span></div>';
    const img = el.querySelector('img');
    img.src = '/img/artists/' + a.photo;
    img.alt = a.name;
    el.querySelector('.t').textContent = a.name;
    tiles.append(el);
});
if (location.pathname.endsWith('.html')) history.replaceState(history.state, '', '/artists' + location.search + location.hash);
</script>
<script src="/js/geo.js"></script>
<script src="/js/nav.js"></script>
</body>
