    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            position: relative;
        }
        /* The WOLFMANWOOF header, one copy filling the screen. The photo is a
           wide panorama, so the sides crop; the crop sits on the kicking
           figure, which is all a phone held upright shows. */
        .hero {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 63% center;
            z-index: 0;
            animation: drift 90s ease-in-out infinite alternate;
            /* iOS shrinks an image under a long press to preview it. */
            pointer-events: none;
            -webkit-user-drag: none;
        }
        @keyframes drift {
            from { transform: scale(1.01); }
            to   { transform: scale(1.05) translate(-0.6%, 0.4%); }
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(16px, 7vw, 160px);
            letter-spacing: 0.25em;
            color: #5c5c58;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
            /* A taller hit area than the letters, so it's an easy tap on a phone. */
            padding: 0.4em 0;
        }
        /* The shapes draw the wordmark; the text stays as the link's hit area and for readers. */
        .flicker-text.drawn { color: transparent; }

        /* Difference keeps the white pieces readable over the bright side of the photo. */
        .geo {
            mix-blend-mode: difference;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* The way in, bottom right: the name links too, but nothing says so, and
           a phone can't hover to find out. No box; the same difference blend as
           the corner marks, and bold so it holds up on mid-grey. */
        .enter {
            position: absolute; z-index: 20;
            right: max(20px, env(safe-area-inset-right, 0px));
            bottom: max(20px, env(safe-area-inset-bottom, 0px));
            display: inline-flex; align-items: center; gap: 14px;
            padding: 10px 0 10px 12px;
            color: #fff; mix-blend-mode: difference; text-decoration: none; font-weight: 700;
            font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
            transition: color 0.2s;
        }
        .enter svg { width: 17px; height: 17px; fill: currentColor; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .enter:focus-visible { mix-blend-mode: normal; color: var(--sig); }
        @media (hover: hover) {
            .enter:hover { mix-blend-mode: normal; color: var(--sig); }
            .enter:hover svg { transform: translateX(4px); }
        }

        /* The mail mark sits on the bright sky of the photo here: plain black. */
        .corner a { color: #000; mix-blend-mode: normal; }

        body { user-select: none; -webkit-touch-callout: none; }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>

<!-- build:summary -->
    <div class="geo-text">
        <h1>Audiospatials</h1>
        <p>Audiospatials is a catalyst of creativity. We make records with independent artists, from folk to techno. A studio in Santa Cruz and Los Angeles, run by Gregor Egan and Hunter Bowersmith.</p>
        <ul><li><a href="/artists">Artists</a></li><li><a href="/music">Music</a></li><li><a href="/studio">Studio</a></li><li><a href="/about">About</a></li><li><a href="/contact">Contact</a></li></ul>
    </div>
<!-- /build:summary -->

    <script src="/js/geo.js"></script>
    <script>
        const container = document.querySelector('.flicker-text');
        const WORD = container.textContent;

        /* The wordmark, from the shared alphabet in geo.js: it holds assembled for
           5s, comes apart and back together over 21s, then holds another 5s.
           It is sized to the link's own text, so the CSS clamp sets the size
           and the clickable box matches the drawing. */
        container.classList.add('drawn');
        const mark = Geo.converge(document.getElementById('geo'), WORD, width => {
            const s = Math.min(container.getBoundingClientRect().width / width, innerHeight * 0.16);
            return { x: (innerWidth - width * s) / 2, y: (innerHeight - s) / 2, s };
        }, { hold: 5, cycle: 21 });
        const explode = () => mark.explode();

        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cAUDIOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%cclick the name. or type: spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
