<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiospatials</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://audiospatials.com/">
    <meta name="description" content="Audiospatials is a music collective and studio in Santa Cruz and Los Angeles. We release music by our artists, and produce and mix for others.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Audiospatials">
    <meta property="og:description" content="A music collective and studio in Santa Cruz and Los Angeles.">
    <meta property="og:image" content="https://audiospatials.com/blur.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://audiospatials.com/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/base.css">
    <script type="speculationrules">
    {"prerender": [{"urls": ["/artists"], "eagerness": "eager"},
                   {"where": {"href_matches": "/*"}, "eagerness": "moderate"}]}
    </script>
    <style>
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            position: relative;
        }
        /* The WOLFMANWOOF header, whole: fitted to the width and repeated down
           the page wherever one copy doesn't reach. It drifts slowly upward;
           with the repeat, the drift never shows an edge. */
        .hero {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: url("/header.webp") center top / 100% auto repeat-y;
            animation: drift 90s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes drift {
            from { background-position: center 0; }
            to   { background-position: center -12vh; }
        }
        .flicker-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--sans);
            font-size: clamp(14px, 6vw, 150px);
            letter-spacing: 0.25em;
            color: #5c5c58;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            z-index: 10;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
            /* A taller hit area than the letters, so it's an easy tap on a phone. */
            padding: 0.4em 0;
        }
        /* The shapes draw the wordmark; the text stays as the link's hit area and for readers. */
        .flicker-text.drawn { color: transparent; }

        /* Difference keeps the white pieces readable over the bright side of the photo. */
        .geo {
            mix-blend-mode: difference;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        body { user-select: none; -webkit-touch-callout: none; }

        html.inverted { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:hello@audiospatials.com?subject=Audiospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5H4L12 11.6 20 5H22V19H2Z"/></svg>
</a>
</div>
    <div class="hero" aria-hidden="true"></div>
    <a class="flicker-text" href="/artists" aria-label="Audiospatials">AUDIOSPATIALS</a>
    <canvas class="geo" id="geo" aria-hidden="true"></canvas>

    <script src="/geo.js"></script>
    <script>
        const container = document.querySelector('.flicker-text');
        const WORD = container.textContent;

        /* The wordmark, from the shared alphabet in geo.js: it holds assembled for
           5s, comes apart and back together over 21s, then holds another 5s.
           It is sized to the link's own text, so the CSS clamp sets the size
           and the clickable box matches the drawing. */
        container.classList.add('drawn');
        const mark = Geo.converge(document.getElementById('geo'), WORD, width => {
            const s = Math.min(container.getBoundingClientRect().width / width, innerHeight * 0.16);
            return { x: (innerWidth - width * s) / 2, y: (innerHeight - s) / 2, s };
        }, { hold: 5, cycle: 21 });
        const explode = () => mark.explode();

        const konami = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
        let konamiAt = 0;
        let typed = '';

        document.addEventListener('keydown', e => {
            konamiAt = (e.key === konami[konamiAt] || e.key.toLowerCase() === konami[konamiAt]) ? konamiAt + 1 : 0;
            if (konamiAt === konami.length) {
                konamiAt = 0;
                document.documentElement.classList.toggle('inverted');
            }

            if (e.key.length === 1) {
                typed = (typed + e.key.toLowerCase()).slice(-9);
                if (typed.endsWith('spatial')) explode();
            }
        });

        console.log('%cAUDIOSPATIALS', 'font: 700 42px/1 Helvetica Neue, Arial; color:#ff2d00');
        console.log('%cclick the name. or type: spatial', 'font: 12px/1.6 monospace; color:#787874');
    </script>
</body>
</html>
