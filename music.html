<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music &mdash; Audiospatials</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="canonical" href="https://audiospatials.com/music">
    <meta name="description" content="Every record released on Audiospatials, from folk to techno. Stream it, and see who made it.">
    <meta name="theme-color" content="#0a0a0a">
    <meta property="og:title" content="Music — Audiospatials">
    <meta property="og:description" content="Every record released on Audiospatials, from folk to techno.">
    <meta property="og:image" content="https://audiospatials.com/img/releases/shifter.webp">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://audiospatials.com/music">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/pages.css">
    <style>
        .videos { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(14px, 2vw, 28px);
                  margin-top: 16px; }
        @media (max-width: 760px) { .videos { grid-template-columns: 1fr; } }
        .videos .player { max-width: none; }
    </style>
</head>
<body>
<div class="corner">
<a class="mailmark" href="mailto:hello@audiospatials.com?subject=Audiospatials" aria-label="Email">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5H4L12 11.6 20 5H22V19H2Z"/></svg>
</a>
</div>
<a class="backmark" href="/" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4.5V10H21V14H12V19.5Z"/></svg></a>
<a class="homemark" href="/" aria-label="Front page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 11.5H19V21H13.8V15H10.2V21H5V11.5H2Z"/></svg></a>
<div class="wrap">
    <h1 data-arrive>Music<em>.</em></h1>

    <section>
        <p class="label">Released on Audiospatials</p>
        <div class="tiles" id="releases" style="margin-top:0"></div>
    </section>

    <section>
        <p class="label">Videos &amp; sessions</p>
        <div class="videos" id="videos"></div>
    </section>
</div>

<nav class="exit">
    <a href="/">Audiospatials</a>
    <a href="/artists">Artists</a><span class="here">Music</span><a href="/studio">Studio</a><a href="/about">About</a><a href="/contact">Contact</a>
    <span class="spacer"></span>
    <span class="copy">&copy; 2026 Audiospatials</span>
</nav>
<script src="/music.js"></script>
<script src="/players.js"></script>
<script src="/covers.js"></script>
<script>
const releases = document.getElementById('releases');
RELEASES.filter(r => r.music !== false).forEach(r => {
    const t = document.createElement('a');
    t.className = 'tile';
    t.href = r.url;
    t.target = '_blank';
    t.rel = 'noopener';
    t.innerHTML = '<div class="shot"><img loading="lazy" decoding="async"></div><div class="cap"><span class="t"></span><span class="m"></span></div>';
    const i = t.querySelector('img');
    coverImg(i, r.cover);
    i.alt = r.title + ' by ' + r.artist;
    t.querySelector('.t').textContent = r.title;
    t.querySelector('.m').textContent = r.artist;
    releases.append(t);
});
const videos = document.getElementById('videos');
VIDEOS.forEach(v => videos.append(Player({ kind: 'youtube', url: v.id, title: v.title, sub: v.artist })));
if (location.pathname.endsWith('.html')) history.replaceState(history.state, '', '/music' + location.search + location.hash);
</script>
<script src="/geo.js"></script>
<script src="/nav.js"></script>
</body>
</html>
